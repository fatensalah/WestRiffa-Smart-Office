<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>إدارة خطة القسم | WestRiffa Smart Office</title>
<link rel="stylesheet" href="../../css/app.css?v=20260914-manage-v4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7f6;color:#173c34}
.head{background:linear-gradient(135deg,#0f513f,#18705a);color:#fff;padding:28px 24px}.inner,.container{width:min(1500px,95%);margin:auto}.head h1{margin:0 0 8px}
.container{margin-top:24px;margin-bottom:60px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.btn,a.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit;display:inline-block}
.soft{background:#fff;color:#0f513f;border:1px solid #dce9e5}.main{background:#0f654f;color:#fff}.gold{background:#8a6916;color:#fff}.danger{background:#a52a2a;color:#fff}
.access,.status{padding:13px 15px;border-radius:12px;margin-bottom:16px;font-weight:700}.access{background:#eaf8ef;border:1px solid #c7e8d1;color:#166534}
.status{display:none}.status.info{display:block;background:#eef7ff;color:#214f72}.status.success{display:block;background:#eaf8ef;color:#166534}.status.error{display:block;background:#fff0f0;color:#9b1c1c}
.card{background:#fff;border:1px solid #e3ece9;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(15,81,63,.05);margin-bottom:20px}
.plan-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}.plan-title{font-size:22px;font-weight:800;color:#0f513f}.actions{display:flex;gap:8px;flex-wrap:wrap}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.badge{background:#f4f8f6;border:1px solid #e0ebe7;border-radius:999px;padding:6px 9px;font-size:12px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:17px 0}.stat{background:#f7faf9;border:1px solid #e3ece9;border-radius:13px;padding:14px;text-align:center}.stat strong{display:block;color:#0f654f;font-size:25px}.stat span{font-size:12px;color:#71847e}
.table-wrap{overflow:auto;border:1px solid #e2ebe8;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:1900px}th,td{padding:10px 8px;border-bottom:1px solid #e7eeeb;text-align:right;vertical-align:top;font-size:12px;line-height:1.55}th{background:#0f654f;color:#fff;white-space:nowrap}
.month{display:inline-block;background:#edf6f2;border-radius:999px;padding:3px 7px;font-size:11px;margin:2px}.small{border:0;border-radius:8px;padding:7px 9px;font-weight:700;cursor:pointer}.edit{background:#e9f4ef;color:#0f654f}.del{background:#fdeaea;color:#982323}
.empty{text-align:center;padding:35px;color:#71847e}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.modal.open{display:flex}.modal-box{background:#fff;width:min(950px,98vw);max-height:92vh;overflow:auto;border-radius:18px;padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:#234f44;display:block;margin-bottom:6px}input,textarea{width:100%;border:1px solid #ccdcd7;border-radius:10px;padding:10px;font:inherit}textarea{min-height:76px}
.month-checks{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.check{display:flex;align-items:center;gap:6px;background:#f7faf9;border:1px solid #e2ece8;padding:8px;border-radius:8px}.check input{width:auto}
.print-only,.signature{display:none}
@media(max-width:900px){.plan-head{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.month-checks{grid-template-columns:repeat(2,1fr)}}
@media print{@page{size:A4 landscape;margin:8mm}body{background:#fff}.head,.top,.access,.status,.actions,.no-print{display:none!important}.container{width:100%;margin:0}.card{box-shadow:none;border:0;padding:0}.print-only{display:block;text-align:center;margin-bottom:10px}.print-only img{width:100%;max-height:74px;object-fit:contain}.table-wrap{overflow:visible;border:0}table{min-width:0}th,td{font-size:9px;padding:5px 4px}.summary{grid-template-columns:repeat(4,1fr)}.signature{display:flex!important;justify-content:space-between;margin-top:16px;border-top:1px solid #8db7aa;padding-top:9px;font-size:11px}}
</style>
</head>
<body>
<header class="head"><div class="inner"><h1>🗂️ إدارة خطة القسم</h1><p>عرض الخطة المرفوعة وإدارتها وتحديث إجراءاتها وطباعتها أو استبدالها.</p></div></header>
<main class="container">
<div class="top"><a class="btn soft" href="index.html">← العودة إلى الخطة التدفقية</a><div><a class="btn soft" href="upload.html">📤 رفع خطة</a> <a class="btn soft" href="reports.html">📑 التقارير</a> <a class="btn soft" href="../../index.html">لوحة التحكم</a></div></div>
<div id="accessBox" class="access">جاري تحميل حسابك وخطتك...</div>
<div id="pageStatus" class="status info">جاري الاتصال بقاعدة البيانات...</div>
<div id="plansContainer"></div>
</main>

<div id="editModal" class="modal"><div class="modal-box">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 id="modalTitle">تعديل الإجراء</h2><button class="btn soft" type="button" onclick="closeModal()">إغلاق</button></div>
<form id="procedureForm">
<input type="hidden" id="procedureId"><input type="hidden" id="planId">
<div class="form-grid">
<div><label>كود المسار</label><input id="pathCode"></div><div><label>المجال</label><input id="domainName"></div>
<div class="full"><label>الهدف العام</label><textarea id="generalGoal"></textarea></div>
<div class="full"><label>الهدف الخاص</label><textarea id="specificGoal"></textarea></div>
<div class="full"><label>معيار النجاح</label><textarea id="successCriterion"></textarea></div>
<div><label>البرنامج / المشروع</label><input id="programName"></div><div><label>الفئة المستهدفة</label><input id="targetGroup"></div>
<div class="full"><label>الإجراء</label><textarea id="procedureText" required></textarea></div>
<div><label>المنفذون</label><input id="implementers"></div><div><label>متابع التنفيذ</label><input id="executionFollower"></div>
<div class="full"><label>أساليب التقويم</label><input id="evaluationMethods"></div>
<div class="full"><label>ملاحظات</label><textarea id="notes"></textarea></div>
<div class="full"><label>شهور التنفيذ</label><div id="monthChecks" class="month-checks"></div></div>
</div>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button type="button" class="btn soft" onclick="closeModal()">إلغاء</button><button type="submit" class="btn main">حفظ الإجراء</button></div>
</form></div></div>

<script src="../../js/config.js?v=20260914-manage-v4"></script>
<script>
"use strict";
const sb=window.supabase.createClient(window.WR_CONFIG.supabaseUrl,window.WR_CONFIG.supabaseKey);
const MONTHS=[[9,"سبتمبر"],[10,"أكتوبر"],[11,"نوفمبر"],[12,"ديسمبر"],[1,"يناير"],[2,"فبراير"],[3,"مارس"],[4,"أبريل"],[5,"مايو"],[6,"يونيو"]];
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
let user=null,displayName="",plans=[],procedures=new Map(),departmentMap=new Map();

function status(m,t="info"){const x=$("pageStatus");x.className=`status ${t}`;x.textContent=m}
function monthName(n){return (MONTHS.find(x=>x[0]===Number(n))||[0,n])[1]}
function domainFallback(r){if(r.domain_name)return r.domain_name;const p=String(r.program_name||"");if(p.includes("آفاق"))return"مجال الإنجاز الأكاديمي";if(p.includes("رايات"))return"مجال التطور الشخصي للطلبة ورعايتهم";if(p.includes("مداد"))return"مجال التعليم والتعلم والتقويم";if(p.includes("خطى"))return"مجال القيادة والإدارة";return"—"}

async function bootstrap(){
  try{
    const {data:{session},error:sessionError}=await sb.auth.getSession();
    if(sessionError)throw sessionError;
    user=session?.user||null;
    if(!user){
      status("لم يتم العثور على جلسة دخول. سيتم تحويلك إلى تسجيل الدخول.","error");
      setTimeout(()=>location.href="../../index.html",1200);
      return;
    }

    displayName=user.email||"";
    try{
      const pr=await sb.from("user_profiles").select("full_name").eq("user_id",user.id).maybeSingle();
      if(!pr.error && pr.data?.full_name)displayName=pr.data.full_name;
    }catch(_){}

    const adminRes=await sb.rpc("plan_user_is_admin");
    const isAdmin=!adminRes.error && adminRes.data===true;

    $("accessBox").textContent=isAdmin
      ? `الحساب: ${displayName} — صلاحية قيادة عليا.`
      : `الحساب: ${displayName} — يتم عرض الخطط المسموح بها لحسابك.`;

    buildMonths();
    await loadData();
  }catch(e){
    console.error(e);
    $("accessBox").textContent="تعذر تحميل صلاحية الحساب.";
    status("تعذر تحميل إدارة الخطة: "+(e.message||e),"error");
  }
}

function buildMonths(){
  $("monthChecks").innerHTML=MONTHS.map(([n,m])=>`<label class="check"><input class="monthInput" type="checkbox" value="${n}">${m}</label>`).join("");
}

async function loadData(){
  status("جاري تحميل الخطة والإجراءات...","info");
  const d=await sb.from("departments").select("id,name");
  if(d.error)throw d.error;
  departmentMap=new Map((d.data||[]).map(x=>[x.id,x.name]));

  const p=await sb.from("plans").select("id,department_id,school_year,plan_title,status,source_file_name,created_at").order("created_at",{ascending:false});
  if(p.error)throw p.error;
  plans=p.data||[];

  procedures.clear();
  for(const plan of plans){
    const r=await sb.from("plan_procedures")
      .select("id,plan_id,sequence_no,path_code,domain_name,general_goal,specific_goal,success_criterion,program_name,objective,procedure_text,target_group,implementers,responsible_person,execution_follower,evaluation_methods,planned_months,notes")
      .eq("plan_id",plan.id)
      .order("sequence_no",{ascending:true});
    if(r.error)throw r.error;
    procedures.set(plan.id,r.data||[]);
  }

  renderPlans();
  status(`تم تحميل ${plans.length} خطة و${[...procedures.values()].reduce((a,b)=>a+b.length,0)} إجراء.`,"success");
}

function renderPlans(){
  if(!plans.length){
    $("plansContainer").innerHTML=`<section class="card empty"><h2>لا توجد خطة مرفوعة حاليًا</h2><p>يمكنك رفع خطة جديدة من صفحة رفع خطة القسم.</p><a class="btn main" href="upload.html">رفع خطة جديدة</a></section>`;
    return;
  }
  $("plansContainer").innerHTML=plans.map(p=>{
    const rows=procedures.get(p.id)||[];
    const domains=new Set(rows.map(domainFallback).filter(x=>x!=="—")).size;
    const programs=new Set(rows.map(x=>x.program_name).filter(Boolean)).size;
    const months=new Set(rows.flatMap(x=>x.planned_months||[])).size;
    return `<section class="card plan-shell" data-plan="${p.id}">
      <div class="print-only"><img src="../../assets/school-header.jpg"><h2>الخطة التشغيلية / التدفقية للقسم</h2></div>
      <div class="plan-head"><div>
        <div class="plan-title">${esc(p.plan_title||"الخطة السنوية")}</div>
        <div class="badges"><span class="badge">القسم: ${esc(departmentMap.get(p.department_id)||"—")}</span><span class="badge">السنة: ${esc(p.school_year||"—")}</span><span class="badge">الإجراءات: ${rows.length}</span><span class="badge">الملف: ${esc(p.source_file_name||"—")}</span></div>
      </div><div class="actions">
        <button class="btn main" onclick="printPlan('${p.id}')">🖨️ طباعة الخطة</button>
        <button class="btn gold" onclick="openAdd('${p.id}')">➕ إضافة إجراء</button>
        <button class="btn danger" onclick="deletePlan('${p.id}')">🗑️ حذف الخطة</button>
      </div></div>
      <div class="summary"><div class="stat"><strong>${rows.length}</strong><span>إجراء</span></div><div class="stat"><strong>${domains}</strong><span>مجال</span></div><div class="stat"><strong>${programs}</strong><span>برنامج / مشروع</span></div><div class="stat"><strong>${months}</strong><span>شهر تنفيذ</span></div></div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>المجال</th><th>الهدف العام</th><th>الهدف الخاص</th><th>معيار النجاح</th><th>البرنامج / المشروع</th><th>الإجراء</th><th>الفئة</th><th>المنفذون</th><th>المتابع</th><th>الشهور</th><th>التقويم</th><th>ملاحظات</th><th class="no-print">إدارة</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(domainFallback(r))}</td><td>${esc(r.general_goal||"—")}</td><td>${esc(r.specific_goal||"—")}</td><td>${esc(r.success_criterion||"—")}</td><td>${esc(r.program_name||"—")}</td><td>${esc(r.procedure_text||"—")}</td><td>${esc(r.target_group||"—")}</td><td>${esc(r.implementers||"—")}</td><td>${esc(r.execution_follower||"—")}</td><td>${(r.planned_months||[]).map(m=>`<span class="month">${monthName(m)}</span>`).join("")}</td><td>${esc(r.evaluation_methods||"—")}</td><td>${esc(r.notes||"—")}</td><td class="no-print"><button class="small edit" onclick="openEdit('${p.id}','${r.id}')">تعديل</button> <button class="small del" onclick="deleteProcedure('${p.id}','${r.id}')">حذف</button></td></tr>`).join("")}</tbody></table></div>
      <div class="signature"><span>إعداد ومتابعة: ${esc(displayName)}</span><span>المديرة المساعدة: خلود الكعبي</span><span>مديرة المدرسة: أحلام السويدي</span></div>
    </section>`;
  }).join("");
}

function printPlan(id){
  const cards=[...document.querySelectorAll(".plan-shell")];
  cards.forEach(x=>x.style.display=x.dataset.plan===id?"block":"none");
  window.print();
  cards.forEach(x=>x.style.display="block");
}
function clearForm(){
  ["procedureId","planId","pathCode","domainName","generalGoal","specificGoal","successCriterion","programName","procedureText","targetGroup","implementers","executionFollower","evaluationMethods","notes"].forEach(id=>$(id).value="");
  document.querySelectorAll(".monthInput").forEach(x=>x.checked=false);
}
function openAdd(planId){clearForm();$("planId").value=planId;$("modalTitle").textContent="إضافة إجراء جديد";$("editModal").classList.add("open")}
function openEdit(planId,id){
  const r=(procedures.get(planId)||[]).find(x=>x.id===id);if(!r)return;
  clearForm();$("planId").value=planId;$("procedureId").value=id;$("modalTitle").textContent="تعديل الإجراء";
  $("pathCode").value=r.path_code||"";$("domainName").value=domainFallback(r)==="—"?"":domainFallback(r);
  $("generalGoal").value=r.general_goal||"";$("specificGoal").value=r.specific_goal||"";$("successCriterion").value=r.success_criterion||"";
  $("programName").value=r.program_name||"";$("procedureText").value=r.procedure_text||"";$("targetGroup").value=r.target_group||"";
  $("implementers").value=r.implementers||"";$("executionFollower").value=r.execution_follower||"";$("evaluationMethods").value=r.evaluation_methods||"";$("notes").value=r.notes||"";
  const set=new Set((r.planned_months||[]).map(Number));document.querySelectorAll(".monthInput").forEach(x=>x.checked=set.has(Number(x.value)));
  $("editModal").classList.add("open");
}
function closeModal(){$("editModal").classList.remove("open")}

$("procedureForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const id=$("procedureId").value,planId=$("planId").value;
  const months=[...document.querySelectorAll(".monthInput:checked")].map(x=>Number(x.value));
  if(!months.length){alert("اختاري شهر تنفيذ واحدًا على الأقل.");return}
  const row={plan_id:planId,path_code:$("pathCode").value.trim()||null,domain_name:$("domainName").value.trim()||null,general_goal:$("generalGoal").value.trim()||null,specific_goal:$("specificGoal").value.trim()||null,success_criterion:$("successCriterion").value.trim()||null,program_name:$("programName").value.trim()||null,objective:$("specificGoal").value.trim()||$("generalGoal").value.trim()||null,procedure_text:$("procedureText").value.trim(),target_group:$("targetGroup").value.trim()||null,implementers:$("implementers").value.trim()||null,responsible_person:$("implementers").value.trim()||null,execution_follower:$("executionFollower").value.trim()||null,evaluation_methods:$("evaluationMethods").value.trim()||null,planned_months:months,notes:$("notes").value.trim()||null};
  try{
    if(id){
      const r=await sb.from("plan_procedures").update(row).eq("id",id);if(r.error)throw r.error;
    }else{
      const rows=procedures.get(planId)||[];row.sequence_no=rows.reduce((m,x)=>Math.max(m,Number(x.sequence_no)||0),0)+1;
      const r=await sb.from("plan_procedures").insert(row);if(r.error)throw r.error;
    }
    closeModal();await loadData();
  }catch(err){status("تعذر حفظ الإجراء: "+(err.message||err),"error")}
});

async function deleteProcedure(planId,id){
  if(!confirm("حذف هذا الإجراء ومتطلباته الشهرية؟"))return;
  try{
    let r=await sb.from("plan_monthly_followups").delete().eq("procedure_id",id);if(r.error)throw r.error;
    r=await sb.from("plan_procedures").delete().eq("id",id);if(r.error)throw r.error;
    await loadData();
  }catch(err){status("تعذر حذف الإجراء: "+(err.message||err),"error")}
}
async function deletePlan(id){
  const p=plans.find(x=>x.id===id);
  if(!confirm(`سيتم حذف «${p?.plan_title||"الخطة"}» بالكامل مع كل الإجراءات والمتابعات. هل أنتِ متأكدة؟`))return;
  if(!confirm("تأكيد أخير: بعد الحذف ستحتاجين إلى رفع خطة جديدة."))return;
  try{
    let r=await sb.from("plan_monthly_followups").delete().eq("plan_id",id);if(r.error)throw r.error;
    r=await sb.from("plan_procedures").delete().eq("plan_id",id);if(r.error)throw r.error;
    r=await sb.from("plans").delete().eq("id",id);if(r.error)throw r.error;
    await loadData();
  }catch(err){status("تعذر حذف الخطة: "+(err.message||err),"error")}
}
document.addEventListener("DOMContentLoaded",bootstrap);
</script>
</body></html>
