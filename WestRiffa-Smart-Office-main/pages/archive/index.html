/* =========================================================
   العام الدراسي
   ========================================================= */

function schoolYearFromDate(value){

  const raw =
    String(
      value ||
      ""
    ).trim();


  if(!raw){

    return "";

  }


  const match =
    raw.match(
      /^(\d{4})-(\d{2})-(\d{2})/
    );


  let year;
  let month;


  if(match){

    year =
      Number(
        match[1]
      );

    month =
      Number(
        match[2]
      );

  }else{

    const date =
      new Date(
        raw
      );


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "";

    }


    year =
      date.getFullYear();

    month =
      date.getMonth() + 1;

  }


  if(
    month >= 8
  ){

    return (
      `${year}/${year + 1}`
    );

  }


  return (
    `${year - 1}/${year}`
  );

}


function recordSchoolYear(record){

  const explicit =
    String(
      record?.school_year ||
      record?.payload?.school_year ||
      record?.payload?.schoolYear ||
      ""
    ).trim();


  if(explicit){

    return explicit;

  }


  return schoolYearFromDate(
    record?.record_date ||
    record?.created_at ||
    record?.payload?.date ||
    record?.payload?.visit_date ||
    record?.payload?.request_date ||
    record?.payload?.lesson_date ||
    record?.payload?.exam_date ||
    ""
  );

}


function schoolYearStart(value){

  const match =
    String(
      value ||
      ""
    ).match(
      /^(\d{4})/
    );


  return match
    ? Number(
        match[1]
      )
    : 0;

}


async function loadActiveSchoolYear(){

  try{

    if(
      window.WRGraph &&
      typeof WRGraph.getActiveSchoolYear ===
        "function"
    ){

      activeSchoolYear =
        String(
          await WRGraph.getActiveSchoolYear(
            true
          ) ||
          ""
        ).trim();

    }

  }catch(error){

    console.warn(
      "تعذر قراءة العام الدراسي النشط:",
      error
    );

  }


  if(!activeSchoolYear){

    activeSchoolYear =
      schoolYearFromDate(
        new Date()
          .toISOString()
      );

  }


  selectedSchoolYear =
    activeSchoolYear;

}


function setupSchoolYearFilter(){

  if(
    !schoolYearFilter
  ){

    return;

  }


  const years =
    new Set();


  if(activeSchoolYear){

    years.add(
      activeSchoolYear
    );

  }


  (
    allRecords ||
    []
  )
    .forEach(
      record => {

        const year =
          recordSchoolYear(
            record
          );


        if(year){

          years.add(
            year
          );

        }

      }
    );


  const sortedYears =
    [
      ...years
    ]
      .sort(
        (
          a,
          b
        ) =>
          schoolYearStart(b) -
          schoolYearStart(a)
      );


  schoolYearFilter.innerHTML =
    [
      '<option value="all">كل الأعوام الدراسية</option>',

      ...sortedYears.map(
        year =>
          `<option value="${esc(year)}">${esc(year)}${year === activeSchoolYear ? " — الحالي" : ""}</option>`
      )
    ]
      .join(
        ""
      );


  if(
    activeSchoolYear &&
    sortedYears.includes(
      activeSchoolYear
    )
  ){

    schoolYearFilter.value =
      activeSchoolYear;

    selectedSchoolYear =
      activeSchoolYear;

  }else{

    schoolYearFilter.value =
      "all";

    selectedSchoolYear =
      "all";

  }


  updateSchoolYearHint();

}


function updateSchoolYearHint(){

  if(
    !schoolYearHint
  ){

    return;

  }


  if(
    selectedSchoolYear ===
    "all"
  ){

    schoolYearHint.textContent =
      "يتم عرض جميع الأعوام الدراسية.";

    return;

  }


  if(
    selectedSchoolYear ===
    activeSchoolYear
  ){

    schoolYearHint.textContent =
      `العام الدراسي النشط: ${activeSchoolYear}`;

    return;

  }


  schoolYearHint.textContent =
    `أرشيف العام الدراسي: ${selectedSchoolYear}`;

}


function recordMatchesSelectedSchoolYear(
  record
){

  if(
    !selectedSchoolYear ||
    selectedSchoolYear ===
    "all"
  ){

    return true;

  }


  return (
    recordSchoolYear(
      record
    ) ===
    selectedSchoolYear
  );

}

/* =========================================================
   Escape
   ========================================================= */

function esc(value){

  return String(
    value ??
    ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   صلاحيات الأرشيف
   ========================================================= */

async function loadArchiveAccess(){

  currentUser =
    await WRGraph.getAccount();


  if(!currentUser){

    location.replace(
      "../../index.html"
    );

    return false;

  }


  currentProfile =
    await WRAccess.getProfile(
      true
    );


  if(!currentProfile){

    throw new Error(
      "تعذر قراءة صلاحيات المستخدم"
    );

  }


  currentRole =
    String(
      currentProfile.role ||
      "teacher"
    )
      .trim()
      .toLowerCase();


  if(
    currentRole ===
    "coordinator"
  ){

    await loadCoordinatorArchiveScope();

  }


  const scopeBox =
    document.getElementById(
      "scopeBox"
    );


  if(
    currentRole ===
    "admin"
  ){

    scopeBox.textContent =
      "صلاحية القيادة العليا — يعرض الأرشيف جميع سجلات المنصة.";

  }


  else if(
    currentRole ===
    "coordinator"
  ){

    const departmentText =

      Array.isArray(
        currentProfile.department_names
      ) &&
      currentProfile.department_names.length

        ? currentProfile
            .department_names
            .join("، ")

        : currentProfile.department_name ||
          "الأقسام المرتبطة بحسابك";


    scopeBox.textContent =

      "صلاحية المنسقة — يظهر أرشيفكِ وسجلات معلمات أقسامك فقط: " +

      departmentText +

      ".";

  }


  else{

    scopeBox.textContent =
      "أرشيفكِ الشخصي — تظهر سجلات حسابك فقط.";

  }


  return true;

}


/* =========================================================
   أقسام ومعلمات المنسقة
   ========================================================= */

async function loadCoordinatorArchiveScope(){

  coordinatorDepartmentIds =
    [];


  coordinatorVisibleUserIds = [
    String(
      currentUser.id
    )
  ];


  let scope =
    null;


  if(
    window.WRAccess &&
    typeof WRAccess.getScope ===
      "function"
  ){

    try{

      scope =
        await WRAccess.getScope();

    }catch(error){

      console.warn(
        "تعذر قراءة نطاق المنسقة:",
        error
      );

    }

  }


  if(
    Array.isArray(
      scope?.department_ids
    )
  ){

    coordinatorDepartmentIds =
      scope
        .department_ids
        .filter(Boolean)
        .map(String);

  }


  if(
    !coordinatorDepartmentIds.length &&
    Array.isArray(
      currentProfile?.department_ids
    )
  ){

    coordinatorDepartmentIds =
      currentProfile
        .department_ids
        .filter(Boolean)
        .map(String);

  }


  if(
    !coordinatorDepartmentIds.length &&
    currentProfile?.department_id
  ){

    coordinatorDepartmentIds = [
      String(
        currentProfile.department_id
      )
    ];

  }


  if(
    !coordinatorDepartmentIds.length
  ){

    return;

  }


  const visibleIds =
    new Set(
      coordinatorVisibleUserIds
    );


  const {
    data:assignments,
    error:assignmentsError
  } =
    await sb

      .from(
        "profile_departments"
      )

      .select(
        `
        profile_id,
        department_id,
        assignment_type
        `
      )

      .in(
        "department_id",
        coordinatorDepartmentIds
      );


  if(assignmentsError){

    console.warn(
      "profile_departments:",
      assignmentsError
    );

  }else{


    (
      assignments ||
      []
    )
      .forEach(
        row => {


          const assignmentType =
            String(
              row.assignment_type ||
              ""
            )
              .trim()
              .toLowerCase();


          if(
            row.profile_id &&
            (
              !assignmentType ||
              assignmentType ===
                "teacher"
            )
          ){

            visibleIds.add(
              String(
                row.profile_id
              )
            );

          }

        }
      );

  }


  const {
    data:legacyTeachers,
    error:legacyError
  } =
    await sb

      .from(
        "user_profiles"
      )

      .select(
        `
        user_id,
        role,
        department_id
        `
      )

      .eq(
        "role",
        "teacher"
      )

      .in(
        "department_id",
        coordinatorDepartmentIds
      );


  if(legacyError){

    console.warn(
      "Legacy departments:",
      legacyError
    );

  }else{


    (
      legacyTeachers ||
      []
    )
      .forEach(
        row => {


          if(
            row.user_id
          ){

            visibleIds.add(
              String(
                row.user_id
              )
            );

          }

        }
      );

  }


  coordinatorVisibleUserIds =
    [
      ...visibleIds
    ];

}


/* =========================================================
   معرفة صاحبة السجل
   ========================================================= */

function recordOwnerId(record){

  return (

    record?.visitor_id ||

    record?.teacher_id ||

    record?.user_id ||

    record?.created_by ||

    record?.owner_id ||

    record?.payload?.visitor_id ||

    record?.payload?.teacher_id ||

    record?.payload?.user_id ||

    record?.payload?.created_by ||

    record?.payload?.owner_id ||

    null

  );

}


/* =========================================================
   فلترة السجلات حسب الحساب
   ========================================================= */

function applyClientScope(records){

  if(
    currentRole ===
    "admin"
  ){

    return records;

  }


  const visibleIds =

    currentRole ===
    "coordinator"

      ? new Set(
          coordinatorVisibleUserIds
            .map(String)
        )

      : new Set([
          String(
            currentUser.id
          )
        ]);


  return records
    .filter(
      record => {


        const ownerId =
          recordOwnerId(
            record
          );


        if(!ownerId){

          return false;

        }


        return visibleIds.has(
          String(
            ownerId
          )
        );

      }
    );

}

/* =========================================================
   تنسيق التاريخ
   ========================================================= */

function formatArchiveDate(value){

  if(!value){

    return "—";

  }


  try{

    const date =
      new Date(
        value
      );


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return String(
        value
      );

    }


    return date
      .toLocaleDateString(
        "ar-BH",
        {
          year:"numeric",
          month:"long",
          day:"numeric"
        }
      );

  }catch(error){

    return String(
      value
    );

  }

}

  return (

    record?.record_date ||

    record?.payload?.visit_date ||

    record?.payload?.request_date ||

    record?.payload?.lesson_date ||

    record?.payload?.exam_date ||

    record?.payload?.created_at ||

}

/* =========================================================
   نص البحث في السجل
   ========================================================= */

function getRecordSearchText(record){

  const payload =
    record?.payload ||
    {};


  let payloadText =
    "";


  try{

    payloadText =
      JSON.stringify(
        payload
      );

  }catch(error){

    payloadText =
      "";

  }


  return [

    getRecordTitle(
      record
    ),

    getTypeLabel(
      record?.type
    ),

    getRecordPerson(
      record
    ),

    getRecordDepartment(
      record
    ),

    getRecordDate(
      record
    ),

    recordSchoolYear(
      record
    ),

    payloadText

  ]
    .join(
      " "
    )
    .toLowerCase();

}


/* =========================================================
   فلترة البحث والتاريخ
   ========================================================= */

function filterFolderRecords(records){

  const search =
    String(
      searchInput.value ||
      ""
    )
      .trim()
      .toLowerCase();


  const from =
    String(
      dateFrom.value ||
      ""
    );


  const to =
    String(
      dateTo.value ||
      ""
    );


  return records.filter(
    record => {

      if(search){

        const text =
          getRecordSearchText(
            record
          );


        if(
          !text.includes(
            search
          )
        ){

          return false;

        }

      }


      const recordDate =
        String(
          getRecordDate(
            record
          ) ||
          ""
        )
          .slice(
            0,
            10
          );


      if(
        from &&
        (
          !recordDate ||
          recordDate < from
        )
      ){

        return false;

      }


      if(
        to &&
        (
          !recordDate ||
          recordDate > to
        )
      ){

        return false;

      }


      return true;

    }
  );

}


/* =========================================================
   ترتيب السجلات من الأحدث
   ========================================================= */

function sortArchiveRecords(records){

  return [
    ...records
  ]
    .sort(
      (
        a,
        b
      ) => {

        const aDate =
          new Date(
            getRecordDate(
              a
            ) ||
            0
          )
            .getTime();


        const bDate =
          new Date(
            getRecordDate(
              b
            ) ||
            0
          )
            .getTime();


        return (
          bDate -
          aDate
        );

      }
    );

}

   رسم سجلات المجلد
   ========================================================= */

  if(
    !currentFolder
  ){

    return;

  }


  let records =
    getFolderRecords(
      currentFolder

  records =
    filterFolderRecords(
      records

  if(
    !records.length
  ){

    recordsList.innerHTML = `

      <div class="empty">

        لا توجد سجلات في هذا المجلد

        ${
          selectedSchoolYear &&
          selectedSchoolYear !== "all"

            ? ` للعام الدراسي <strong>${esc(selectedSchoolYear)}</strong>`

            : ""
        }.

      </div>

    `;


    return;

  }


  recordsList.innerHTML =
    records
      .map(
        record => {


          const title =
            getRecordTitle(
              record
            );


          const typeLabel =
            getTypeLabel(
              record.type
            );


          const date =
            getRecordDate(
              record
            );


          const person =
            getRecordPerson(
              record
            );


          const department =
            getRecordDepartment(
              record
            );


          const year =
            recordSchoolYear(
              record
            );


          const url =
            getRecordUrl(
              record
            );


          return `

            <article class="record-card">

              <h3>
                ${esc(title)}
              </h3>


              <div class="record-meta">

                <div>
                  <strong>النوع:</strong>
                  ${esc(typeLabel)}
                </div>


                <div>
                  <strong>التاريخ:</strong>
                  ${esc(
                    formatArchiveDate(
                      date
                    )
                  )}
                </div>


                ${
                  year

                    ? `

                      <div>
                        <strong>العام الدراسي:</strong>
                        ${esc(year)}
                      </div>

                    `

                    : ""
                }


                ${
                  person

                    ? `

                      <div>
                        <strong>الاسم:</strong>
                        ${esc(person)}
                      </div>

                    `

                    : ""
                }


                ${
                  department

                    ? `

                      <div>
                        <strong>القسم:</strong>
                        ${esc(department)}
                      </div>

                    `

                    : ""
                }

              </div>


              <div class="record-actions">

                ${
                  url !== "#"

                    ? `

                      <a
                        class="btn-open"
                        href="${esc(url)}"
                      >
                        فتح السجل
                      </a>

                    `

                    : ""
                }

              </div>

            </article>

          `;

        }
      )
      .join(
        ""
      );

async function loadAllRecords(){

  try{


    const results =
      await Promise.all([

        loadMainRecords(),

        loadExchangeVisits(),

        loadClassroomVisits(),

        loadPermissionRequests(),

        loadLessonPlans(),

        loadGrades()

      ]);


    const [
      mainRecords,
      exchangeVisits,
      classroomVisits,
      permissionRequests,
      lessonPlans,
      grades
    ] =
      results;


    /*
      حذف الأنواع التي ألغيناها
      من المنصة.
    */

    const cleanedMainRecords =
      (
        mainRecords ||
        []
      )
        .filter(
          record =>
            ![
              "attendance",
              "recommendation"
            ].includes(
              record.type
            )
        );


    /*
      دمج كل مصادر البيانات.
    */

    const merged =
      [

        ...cleanedMainRecords,

        ...exchangeVisits,

        ...classroomVisits,

        ...permissionRequests,

        ...lessonPlans,

        ...grades

      ];


    /*
      تطبيق صلاحيات الحساب:
      admin = الكل
      coordinator = أقسامها
      teacher = سجلاتها
    */

    allRecords =
      applyClientScope(
        merged
      );


    /*
      ترتيب عام من الأحدث.
    */

    allRecords =
      sortArchiveRecords(
        allRecords
      );


    /*
      بناء قائمة الأعوام الدراسية
      من البيانات الموجودة.
    */

    setupSchoolYearFilter();


    /*
      تحديث أعداد المجلدات
      حسب العام المختار.
    */

    updateCounts();


    /*
      لو المستخدم داخل مجلد بالفعل،
      نعيد رسمه.
    */

    if(
      currentFolder
    ){

      renderCurrentFolder();

    }


    console.log(
      "Archive loaded:",
      {
        records:
          allRecords.length,

        activeSchoolYear,

        selectedSchoolYear
      }
    );


  }catch(error){


    console.error(
      "Archive load error:",
      error
    );


    alert(
      "تعذر تحميل بعض بيانات الأرشيف: " +
      (
        error.message ||
        error
      )
    );

  }

}


/* =========================================================
   تغيير العام الدراسي
   ========================================================= */

if(
  schoolYearFilter
){

  schoolYearFilter
    .addEventListener(
      "change",
      () => {


        selectedSchoolYear =
          schoolYearFilter.value ||
          "all";


        updateSchoolYearHint();


        /*
          الأعداد الموجودة على المجلدات
          تتغير تلقائيًا حسب السنة.
        */

        updateCounts();


        /*
          إذا كان المستخدم داخل مجلد
          نعرض سجلات السنة الجديدة فورًا.
        */

        if(
          currentFolder
        ){

          renderCurrentFolder();

        }

      }
    );

}


/* =========================================================
   فتح المجلدات
   ========================================================= */

document
  .querySelectorAll(
    ".folder-card"
  )
  .forEach(
    card => {

      card.addEventListener(
        "click",
        () => {

          openFolder(
            card.dataset.folder
          );

        }
      );

    }
  );


/* =========================================================
   الرجوع للمجلدات
   ========================================================= */

backFoldersBtn
  .addEventListener(
    "click",
    showFolders
  );


/* =========================================================
   البحث
   ========================================================= */

searchInput
  .addEventListener(
    "input",
    renderCurrentFolder
  );


/* =========================================================
   من تاريخ
   ========================================================= */

dateFrom
  .addEventListener(
    "change",
    renderCurrentFolder
  );


/* =========================================================
   إلى تاريخ
   ========================================================= */

dateTo
  .addEventListener(
    "change",
    renderCurrentFolder
  );


/* =========================================================
   تشغيل الأرشيف
   ========================================================= */

document
  .addEventListener(
    "DOMContentLoaded",
    async () => {

      try{


        /*
          أولًا:
          التحقق من المستخدم والصلاحيات.
        */

        const allowed =
          await loadArchiveAccess();


        if(
          !allowed
        ){

          return;

        }


        /*
          ثانيًا:
          قراءة العام الدراسي النشط
          من app_settings.
        */

        await loadActiveSchoolYear();


        /*
          ثالثًا:
          تحميل كل بيانات الأرشيف.
        */

        await loadAllRecords();


      }catch(error){


        console.error(
          "Archive access error:",
          error
        );


        alert(
          "تعذر التحقق من صلاحية الأرشيف: " +
          (
            error.message ||
            error
          )
        );


      }finally{


        accessLoader.style.display =
          "none";

      }

    }
  );

</script>


</body>

</html>
