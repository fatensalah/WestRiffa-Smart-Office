<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير مركز مصادر التعلم</title><link rel="stylesheet" href="../../css/resource-center.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="rc-body"><header class="rc-hero"><div class="rc-shell rc-brand"><div class="rc-school-mark"><img src="../../assets/school-header.jpg" alt="شعار المدرسة"></div><div><h1 class="rc-title">التقرير التنفيذي للمركز</h1><p class="rc-sub">ملخص جاهز للطباعة يعرض الاستخدام والأثر والرضا.</p></div></div></header><main class="rc-shell"><div class="rc-top no-print"><a class="rc-back" href="index.html">← مركز المصادر</a><button class="rc-btn" onclick="window.print()">طباعة / حفظ PDF</button></div><section class="rc-glass" id="report"><img class="rc-report-logo" src="../../assets/school-header.jpg" alt="شعار المدرسة"><h2>مركز مصادر التعلم — التقرير الشامل</h2><p>جاري إعداد التقرير من البيانات الفعلية…</p></section></main><script src="../../js/config.js"></script><script src="../../js/graph.js"></script><script src="../../js/common.js"></script><script src="../../js/resource-center.js"></script><script>(async()=>{await WRRC.init();if(WRRC.profile.role!=='admin'){wrShowAccessDenied('التقرير الشامل مخصص للقيادة.');return}const {data,error}=await WRRC.sb.from('resource_center_activations').select('*').order('completed_at',{ascending:false});if(error){report.innerHTML='<h2>يلزم تجهيز Supabase</h2><p>شغلي ملف SUPABASE-SETUP.sql ثم أعيدي فتح التقرير.</p>';return}const a=data||[],st=a.reduce((s,x)=>s+(+x.student_count||0),0),t=new Set(a.map(x=>x.teacher_user_id)).size,ss=a.filter(x=>x.satisfaction_score).map(x=>+x.satisfaction_score),avg=ss.length?(ss.reduce((x,y)=>x+y,0)/ss.length).toFixed(1):'—';report.innerHTML=`<div style="text-align:center"><img class="rc-report-logo" src="../../assets/school-header.jpg" alt="شعار المدرسة"><h2>التقرير الشامل لتفعيل مركز مصادر التعلم</h2><p>مدرسة الرفاع الغربي الابتدائية للبنين • العام الدراسي 2026–2027</p></div><div class="rc-metrics" style="margin:25px 0"><div class="rc-metric"><b>${a.length}</b><span>تفعيل</span></div><div class="rc-metric"><b>${st}</b><span>مرة استفادة للطلاب</span></div><div class="rc-metric"><b>${t}</b><span>معلمة مشاركة</span></div><div class="rc-metric"><b>${avg}</b><span>متوسط الرضا / 5</span></div></div><h3>قراءة تنفيذية</h3><p>يوثق هذا التقرير الاستخدام الفعلي لمركز مصادر التعلم من خلال التفعيلات المسجلة في النظام، وأعداد المستفيدين ونتائج قياس رضا المستفيدين.</p><h3>أحدث الشواهد المسجلة</h3>${a.slice(0,10).map(x=>`<p>• ${WRRC.esc(x.teacher_name)} — ${WRRC.esc(x.activation_type_label)} — ${WRRC.esc(x.grade)} / ${WRRC.esc(x.section)} — ${x.student_count} طالبًا — ${WRRC.fmt(x.completed_at)}</p>`).join('')||'<p>لا توجد بيانات بعد.</p>'}<hr><p style="text-align:center">إعداد وإدارة مركز مصادر التعلم: فاتن صلاح</p>`})();</script></body></html>
