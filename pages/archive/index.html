<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأرشيف الذكي</title><link rel="stylesheet" href="../../css/app.css"><link rel="manifest" href="../../manifest.webmanifest"><meta name="theme-color" content="#075c40"></head><body>
<header class="topbar"><div class="brand"><img src="../../assets/school-header.jpg" alt="شعار المدرسة"><div><h1>الأرشيف الذكي</h1><p>عرض وتعديل واسترجاع السجلات</p></div></div><div class="header-actions"><a class="btn btn-soft" href="../../index.html">🏠 الرئيسية</a><a class="btn btn-primary" href="../activities/report.html">➕ تقرير فعالية</a></div></header>
<div class="shell"><aside class="sidebar"><h3 class="sidebar-title">القائمة الرئيسية</h3><a class="nav-link" href="../../index.html">🏠 لوحة التحكم</a><a class="nav-link" href="../meetings/index.html">📅 الاجتماعات</a><a class="nav-link" href="../activities/index.html">🎯 الفعاليات</a><a class="nav-link" href="../certificates/index.html">🏅 الشهادات</a><a class="nav-link active" href="index.html">📂 الأرشيف الذكي</a><a class="nav-link" href="../settings/index.html">⚙️ الإعدادات</a></aside>
<main class="content"><div class="page-head"><div><h2>الأرشيف الذكي</h2><p>ابحثي، افتحي، عدلي، اطبعي، أو احذفي أي سجل.</p></div><div class="page-actions"><button class="btn btn-gold" onclick="wrExport()">⬇ نسخة احتياطية كاملة</button><button id="importBtn" class="btn btn-soft">⬆ استيراد</button><input id="importFile" type="file" accept=".json" hidden><button id="clearBtn" class="btn btn-danger">حذف الكل</button></div></div>
<div class="filters"><input id="search" placeholder="بحث بالعنوان أو المنفذ أو المكان"><select id="type"><option value="">كل الأنواع</option><option value="activity">تقرير فعالية</option><option value="invitation">دعوة</option><option value="meeting">محضر اجتماع</option><option value="attendance">سجل حضور</option><option value="recommendation">متابعة توصية</option><option value="certificate">شهادة</option></select></div><div id="grid" class="archive-grid"></div></main></div>
<script src="../../js/config.js"></script><script src="../../js/graph.js"></script><script src="../../js/common.js"></script>
<script>
function editUrl(r){if(r.type==='activity')return `../activities/report.html?id=${encodeURIComponent(r.id)}`;return '#'}
function render(){const q=$("search").value.toLowerCase().trim(),t=$("type").value;const a=wrGetRecords().filter(r=>(!t||r.type===t)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));const box=$("grid");box.innerHTML=a.length?"":'<div class="empty" style="grid-column:1/-1">لا توجد نتائج.</div>';a.forEach(r=>{const c=document.createElement("article");c.className="archive-card";const imgs=(r.imageRefs||[]).length;c.innerHTML=`<div class="archive-card-head"><span class="tag">${wrTypeLabel(r.type)}</span><span class="small">${r.syncStatus==='synced'?'متزامن':'محلي'}</span></div><h3>${r.title||'بدون عنوان'}</h3><p>${r.executor?`المنفذ: ${r.executor}<br>`:""}${r.date?`التاريخ: ${wrFormatDate(r.date)}<br>`:""}${r.place?`المكان: ${r.place}<br>`:""}${imgs?`الصور: ${imgs}<br>`:""}آخر تحديث: ${new Date(r.updatedAt||r.createdAt).toLocaleString("ar-BH")}</p><div class="archive-actions">${r.type==='activity'?`<a class="btn btn-primary" href="${editUrl(r)}">فتح / تعديل</a>`:""}<button class="btn btn-danger" data-id="${r.id}">حذف</button></div>`;box.appendChild(c)});box.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{if(confirm("حذف السجل وصوره؟")){await wrDeleteRecord(b.dataset.id);render()}})}
$("search").oninput=render;$("type").onchange=render;$("clearBtn").onclick=async()=>{if(confirm("حذف جميع السجلات والصور؟")){for(const r of wrGetRecords())await wrDeleteRecord(r.id);render()}};$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=e=>wrImport(e.target.files[0],ok=>{alert(ok?"تم استيراد السجلات والصور":"الملف غير صالح");render()});window.addEventListener("wr-records-changed",render);render();
</script></body></html>
