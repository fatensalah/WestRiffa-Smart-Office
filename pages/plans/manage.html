<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>إدارة خطة القسم | WestRiffa Smart Office</title>
<link rel="stylesheet" href="../../css/app.css?v=20260914-plans-manage1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7f6;color:#173c34}.page-header{background:linear-gradient(135deg,#0f513f,#18705a);color:#fff;padding:28px 24px}.page-header-inner,.container{width:min(1500px,95%);margin:auto}.page-header h1{margin:0 0 8px}.container{margin-top:26px;margin-bottom:60px}.top-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn-link,.btn{display:inline-block;border:0;text-decoration:none;padding:11px 16px;border-radius:11px;font-weight:700;cursor:pointer;font-family:inherit}.btn-link,.btn-soft{background:#fff;color:#0f513f;border:1px solid #dce9e5}.btn-main{background:#0f654f;color:#fff}.btn-gold{background:#8a6916;color:#fff}.btn-danger{background:#a52a2a;color:#fff}.access{background:#eaf8ef;border:1px solid #c7e8d1;color:#166534;padding:14px 16px;border-radius:13px;margin-bottom:18px;font-weight:700}.status{display:none;padding:13px 15px;border-radius:11px;margin-bottom:16px}.status.info{display:block;background:#eef7ff;color:#214f72}.status.success{display:block;background:#eaf8ef;color:#166534}.status.error{display:block;background:#fff0f0;color:#9b1c1c}.card{background:#fff;border:1px solid #e3ece9;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(15,81,63,.05);margin-bottom:20px}.plan-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}.plan-title{font-size:22px;font-weight:800;color:#0f513f}.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.badge{background:#f4f8f6;border:1px solid #e0ebe7;border-radius:999px;padding:6px 9px;font-size:12px}.actions,.small-actions{display:flex;gap:7px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:17px 0}.stat{background:#f7faf9;border:1px solid #e3ece9;border-radius:13px;padding:14px;text-align:center}.stat strong{display:block;color:#0f654f;font-size:25px}.stat span{font-size:12px;color:#71847e}.table-wrap{overflow:auto;border:1px solid #e2ebe8;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:1900px}th,td{padding:10px 8px;border-bottom:1px solid #e7eeeb;text-align:right;vertical-align:top;font-size:12px;line-height:1.55}th{background:#0f654f;color:#fff;white-space:nowrap}.months{display:flex;flex-wrap:wrap;gap:4px}.month{background:#edf6f2;border-radius:999px;padding:3px 7px;font-size:11px}.edit,.del{border:0;border-radius:8px;padding:7px 9px;font-weight:700;cursor:pointer}.edit{background:#e9f4ef;color:#0f654f}.del{background:#fdeaea;color:#982323}.empty{text-align:center;padding:35px;color:#71847e}.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.modal.open{display:flex}.modal-box{background:#fff;width:min(950px,98vw);max-height:92vh;overflow:auto;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:#234f44;display:block;margin-bottom:6px}input,textarea{width:100%;border:1px solid #ccdcd7;border-radius:10px;padding:10px;font:inherit}textarea{min-height:76px}.month-checks{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.check{display:flex;align-items:center;gap:6px;background:#f7faf9;border:1px solid #e2ece8;padding:8px;border-radius:8px}.check input{width:auto}.print-only{display:none}
@media(max-width:900px){.plan-head{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.month-checks{grid-template-columns:repeat(2,1fr)}}
@media print{@page{size:A4 landscape;margin:8mm}body{background:#fff}.page-header,.top-actions,.access,.status,.actions,.small-actions,.no-print{display:none!important}.container{width:100%;margin:0}.card{box-shadow:none;border:0;padding:0}.print-only{display:block;text-align:center;margin-bottom:10px}.print-only img{width:100%;max-height:74px;object-fit:contain}.table-wrap{overflow:visible;border:0}table{min-width:0}th,td{font-size:9px;padding:5px 4px}.summary{grid-template-columns:repeat(4,1fr)}.signature{display:flex!important;justify-content:space-between;margin-top:16px;border-top:1px solid #8db7aa;padding-top:9px;font-size:11px}}
.signature{display:none}
</style></head>
<body>
<header class="page-header"><div class="page-header-inner"><h1>🗂️ إدارة خطة القسم</h1><p>عرض الخطة المرفوعة وإدارتها وتحديث إجراءاتها وطباعتها أو استبدالها.</p></div></header>
<main class="container">
<div class="top-actions"><a class="btn-link" href="index.html">← العودة إلى الخطة التدفقية</a><div><a class="btn-link" href="upload.html">📤 رفع خطة</a> <a class="btn-link" href="reports.html">📑 التقارير</a> <a class="btn-link" href="../../index.html">لوحة التحكم</a></div></div>
<div id="accessBox" class="access">جاري التحقق من الصلاحية...</div><div id="pageStatus" class="status"></div><div id="plansContainer"></div>
</main>
<div id="editModal" class="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">تعديل الإجراء</h2><button class="btn btn-soft" type="button" onclick="closeModal()">إغلاق</button></div>
<form id="procedureForm"><input type="hidden" id="procedureId"><input type="hidden" id="planId"><div class="form-grid">
<div><label>كود المسار</label><input id="pathCode"></div><div><label>المجال</label><input id="domainName"></div><div class="full"><label>الهدف العام</label><textarea id="generalGoal"></textarea></div><div class="full"><label>الهدف الخاص</label><textarea id="specificGoal"></textarea></div><div class="full"><label>معيار النجاح</label><textarea id="successCriterion"></textarea></div><div><label>البرنامج / المشروع</label><input id="programName"></div><div><label>الفئة المستهدفة</label><input id="targetGroup"></div><div class="full"><label>الإجراء</label><textarea id="procedureText" required></textarea></div><div><label>المنفذون</label><input id="implementers"></div><div><label>متابع التنفيذ</label><input id="executionFollower"></div><div class="full"><label>أساليب التقويم</label><input id="evaluationMethods"></div><div class="full"><label>ملاحظات</label><textarea id="notes"></textarea></div><div class="full"><label>شهور التنفيذ</label><div id="monthChecks" class="month-checks"></div></div>
</div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button type="button" class="btn btn-soft" onclick="closeModal()">إلغاء</button><button type="submit" class="btn btn-main">حفظ الإجراء</button></div></form></div></div>
<script src="../../js/config.js?v=20260914-plans-manage1"></script><script src="../../js/graph.js?v=20260914-plans-manage1"></script><script src="../../js/common.js?v=20260914-plans-manage1"></script>
<script>
"use strict";
const sb=window.supabase.createClient(window.WR_CONFIG.supabaseUrl,window.WR_CONFIG.supabaseKey);
const MONTHS=[[9,"سبتمبر"],[10,"أكتوبر"],[11,"نوفمبر"],[12,"ديسمبر"],[1,"يناير"],[2,"فبراير"],[3,"مارس"],[4,"أبريل"],[5,"مايو"],[6,"يونيو"]];
let user=null,profile=null,departmentMap=new Map(),plans=[],procedures=new Map(),isAdmin=false;
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function status(m,t="info"){let x=$("pageStatus");x.className=`status ${t}`;x.textContent=m}function hideStatus(){$("pageStatus").className="status"}
function monthName(n){return (MONTHS.find(x=>x[0]===Number(n))||[0,n])[1]}
function domainFallback(r){if(r.domain_name)return r.domain_name;let p=String(r.program_name||"");if(p.includes("آفاق"))return"مجال الإنجاز الأكاديمي";if(p.includes("رايات"))return"مجال التطور الشخصي للطلبة ورعايتهم";if(p.includes("مداد"))return"مجال التعليم والتعلم والتقويم";if(p.includes("خطى"))return"مجال القيادة والإدارة";return"—"}
document.addEventListener("DOMContentLoaded", init);
async function init(){
  try{
    if(window.WRGraph && typeof WRGraph.init === "function"){
      await WRGraph.init();
    }

    if(window.WRGraph && typeof WRGraph.getAccount === "function"){
      user = await WRGraph.getAccount();
    }else{
      const a = await sb.auth.getUser();
      if(a.error) throw a.error;
      user = a.data?.user || null;
    }

    if(!user){
      location.replace("../../index.html");
      return;
    }

    if(window.WRAccess && typeof WRAccess.getProfile === "function"){
      profile = await WRAccess.getProfile(true);
    }else if(window.WRGraph && typeof WRGraph.getUserProfile === "function"){
      profile = await WRGraph.getUserProfile();
    }else{
      let r = await sb.from("user_profiles").select("*").eq("user_id",user.id).maybeSingle();
      if(r.error && r.error.code !== "PGRST116") throw r.error;
      profile = r.data || null;
      if(!profile){
        r = await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
        if(r.error && r.error.code !== "PGRST116") throw r.error;
        profile = r.data || null;
      }
    }

    const role = String(profile?.role || "").trim().toLowerCase();
    isAdmin = role === "admin";

    if(!profile || !["admin","coordinator"].includes(role)){
      throw new Error("هذا الحساب لا يمتلك صلاحية إدارة الخطط.");
    }

    $("accessBox").textContent = isAdmin
      ? "صلاحية القيادة العليا — يمكنك إدارة خطط المدرسة وفق صلاحيات الحساب."
      : `الحساب: ${profile?.full_name || user.email || ""} — يمكنك إدارة خطة القسم المرتبطة بحسابك.`;

    const d = await sb.from("departments").select("id,name");
    if(d.error) throw d.error;
    departmentMap = new Map((d.data || []).map(x => [x.id,x.name]));

    buildMonths();
    await load();
  }catch(e){
    console.error("Manage init error:",e);
    status("تعذر تحميل إدارة الخطة: "+(e.message || e),"error");
    $("accessBox").textContent = "تعذر التحقق من الصلاحية — راجعي رسالة الخطأ أدناه.";
  }
}
function buildMonths(){$("monthChecks").innerHTML=MONTHS.map(([n,m])=>`<label class="check"><input class="monthInput" type="checkbox" value="${n}">${m}</label>`).join("")}
async function load(){status("جاري تحميل الخطة...","info");let q=sb.from("plans").select("id,department_id,coordinator_id,school_year,plan_title,status,source_file_name,created_at").order("created_at",{ascending:false});let r=await q;if(r.error)throw r.error;plans=r.data||[];procedures.clear();for(let p of plans){let z=await sb.from("plan_procedures").select("id,plan_id,sequence_no,path_code,domain_name,general_goal,specific_goal,success_criterion,program_name,objective,procedure_text,target_group,implementers,responsible_person,execution_follower,evaluation_methods,planned_months,notes").eq("plan_id",p.id).order("sequence_no");if(z.error)throw z.error;procedures.set(p.id,z.data||[])}render();hideStatus()}
function render(){if(!plans.length){$("plansContainer").innerHTML=`<section class="card empty"><h2>لا توجد خطة مرفوعة حاليًا</h2><p>يمكنك رفع خطة جديدة من صفحة رفع خطة القسم.</p><a class="btn btn-main" href="upload.html">رفع خطة جديدة</a></section>`;return}$("plansContainer").innerHTML=plans.map(p=>{let rows=procedures.get(p.id)||[];return`<section class="card plan-shell" data-plan="${p.id}"><div class="print-only"><img src="../../assets/school-header.jpg"><h2>الخطة التشغيلية / التدفقية للقسم</h2></div><div class="plan-head"><div><div class="plan-title">${esc(p.plan_title||"الخطة السنوية")}</div><div class="badges"><span class="badge">القسم: ${esc(departmentMap.get(p.department_id)||"—")}</span><span class="badge">السنة: ${esc(p.school_year)}</span><span class="badge">الإجراءات: ${rows.length}</span><span class="badge">الملف: ${esc(p.source_file_name||"—")}</span></div></div><div class="actions"><button class="btn btn-main" onclick="printPlan('${p.id}')">🖨️ طباعة</button><button class="btn btn-gold" onclick="openAdd('${p.id}')">➕ إضافة إجراء</button><button class="btn btn-danger" onclick="deletePlan('${p.id}')">🗑️ حذف الخطة</button></div></div><div class="summary"><div class="stat"><strong>${rows.length}</strong><span>إجراء</span></div><div class="stat"><strong>${new Set(rows.map(x=>domainFallback(x))).size}</strong><span>مجال</span></div><div class="stat"><strong>${new Set(rows.map(x=>x.program_name).filter(Boolean)).size}</strong><span>برنامج / مشروع</span></div><div class="stat"><strong>${new Set(rows.flatMap(x=>x.planned_months||[])).size}</strong><span>شهر تنفيذ</span></div></div><div class="table-wrap"><table><thead><tr><th>#</th><th>المجال</th><th>الهدف العام</th><th>الهدف الخاص</th><th>معيار النجاح</th><th>البرنامج / المشروع</th><th>الإجراء</th><th>الفئة</th><th>المنفذون</th><th>المتابع</th><th>الشهور</th><th>التقويم</th><th>ملاحظات</th><th class="no-print">إدارة</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(domainFallback(r))}</td><td>${esc(r.general_goal||"—")}</td><td>${esc(r.specific_goal||"—")}</td><td>${esc(r.success_criterion||"—")}</td><td>${esc(r.program_name||"—")}</td><td>${esc(r.procedure_text||"—")}</td><td>${esc(r.target_group||"—")}</td><td>${esc(r.implementers||"—")}</td><td>${esc(r.execution_follower||"—")}</td><td><div class="months">${(r.planned_months||[]).map(m=>`<span class="month">${monthName(m)}</span>`).join("")}</div></td><td>${esc(r.evaluation_methods||"—")}</td><td>${esc(r.notes||"—")}</td><td class="no-print"><div class="small-actions"><button class="edit" onclick="openEdit('${p.id}','${r.id}')">تعديل</button><button class="del" onclick="deleteProcedure('${p.id}','${r.id}')">حذف</button></div></td></tr>`).join("")}</tbody></table></div><div class="signature"><span>منسقة القسم: ${esc(profile?.full_name||"")}</span><span>المديرة المساعدة: خلود الكعبي</span><span>مديرة المدرسة: أحلام السويدي</span></div></section>`}).join("")}
function printPlan(id){document.querySelectorAll(".plan-shell").forEach(x=>x.style.display=x.dataset.plan===id?"block":"none");window.print();document.querySelectorAll(".plan-shell").forEach(x=>x.style.display="block")}
function clearForm(){["procedureId","pathCode","domainName","generalGoal","specificGoal","successCriterion","programName","procedureText","targetGroup","implementers","executionFollower","evaluationMethods","notes"].forEach(id=>$(id).value="");document.querySelectorAll(".monthInput").forEach(x=>x.checked=false)}
function openAdd(planId){clearForm();$("planId").value=planId;$("modalTitle").textContent="إضافة إجراء جديد";$("editModal").classList.add("open")}
function openEdit(planId,id){let r=(procedures.get(planId)||[]).find(x=>x.id===id);if(!r)return;clearForm();$("planId").value=planId;$("procedureId").value=id;$("modalTitle").textContent="تعديل الإجراء";$("pathCode").value=r.path_code||"";$("domainName").value=domainFallback(r)==="—"?"":domainFallback(r);$("generalGoal").value=r.general_goal||"";$("specificGoal").value=r.specific_goal||"";$("successCriterion").value=r.success_criterion||"";$("programName").value=r.program_name||"";$("procedureText").value=r.procedure_text||"";$("targetGroup").value=r.target_group||"";$("implementers").value=r.implementers||"";$("executionFollower").value=r.execution_follower||"";$("evaluationMethods").value=r.evaluation_methods||"";$("notes").value=r.notes||"";let set=new Set((r.planned_months||[]).map(Number));document.querySelectorAll(".monthInput").forEach(x=>x.checked=set.has(Number(x.value)));$("editModal").classList.add("open")}
function closeModal(){$("editModal").classList.remove("open")}
$("procedureForm").addEventListener("submit",async e=>{e.preventDefault();let id=$("procedureId").value,planId=$("planId").value,months=[...document.querySelectorAll(".monthInput:checked")].map(x=>Number(x.value));if(!months.length){alert("اختاري شهر تنفيذ واحدًا على الأقل.");return}let row={plan_id:planId,path_code:$("pathCode").value.trim()||null,domain_name:$("domainName").value.trim()||null,general_goal:$("generalGoal").value.trim()||null,specific_goal:$("specificGoal").value.trim()||null,success_criterion:$("successCriterion").value.trim()||null,program_name:$("programName").value.trim()||null,objective:$("specificGoal").value.trim()||$("generalGoal").value.trim()||null,procedure_text:$("procedureText").value.trim(),target_group:$("targetGroup").value.trim()||null,implementers:$("implementers").value.trim()||null,responsible_person:$("implementers").value.trim()||null,execution_follower:$("executionFollower").value.trim()||null,evaluation_methods:$("evaluationMethods").value.trim()||null,planned_months:months,notes:$("notes").value.trim()||null};try{status(id?"جاري تعديل الإجراء...":"جاري إضافة الإجراء...","info");if(id){let r=await sb.from("plan_procedures").update(row).eq("id",id);if(r.error)throw r.error}else{let rows=procedures.get(planId)||[];row.sequence_no=rows.reduce((m,x)=>Math.max(m,Number(x.sequence_no)||0),0)+1;let r=await sb.from("plan_procedures").insert(row);if(r.error)throw r.error}closeModal();await load();status(id?"تم تعديل الإجراء بنجاح.":"تمت إضافة الإجراء بنجاح.","success")}catch(er){console.error(er);status("تعذر الحفظ: "+(er.message||er),"error")}});
async function deleteProcedure(planId,id){if(!confirm("حذف هذا الإجراء ومتطلباته الشهرية؟"))return;try{status("جاري حذف الإجراء...","info");let r=await sb.from("plan_monthly_followups").delete().eq("procedure_id",id);if(r.error)throw r.error;r=await sb.from("plan_procedures").delete().eq("id",id);if(r.error)throw r.error;await load();status("تم حذف الإجراء.","success")}catch(e){status("تعذر حذف الإجراء: "+(e.message||e),"error")}}
async function deletePlan(id){let p=plans.find(x=>x.id===id);if(!confirm(`سيتم حذف «${p?.plan_title||"الخطة"}» بالكامل مع كل الإجراءات والمتابعات. هل أنتِ متأكدة؟`))return;if(!confirm("تأكيد أخير: بعد الحذف ستحتاجين إلى رفع خطة جديدة."))return;try{status("جاري حذف الخطة...","info");let r=await sb.from("plan_monthly_followups").delete().eq("plan_id",id);if(r.error)throw r.error;r=await sb.from("plan_procedures").delete().eq("plan_id",id);if(r.error)throw r.error;r=await sb.from("plans").delete().eq("id",id);if(r.error)throw r.error;await load();status("تم حذف الخطة بالكامل. يمكنك الآن رفع خطة جديدة.","success")}catch(e){status("تعذر حذف الخطة: "+(e.message||e),"error")}}
</script></body></html>
