<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أرشيف تفعيل مركز مصادر التعلم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#173c34;font-family:Tahoma,Arial,sans-serif}.hero{background:linear-gradient(135deg,#075c40,#16805e);color:#fff;padding:26px}.wrap{width:min(1180px,94%);margin:auto}.hero h1{margin:0 0 7px}.hero p{margin:0;opacity:.92}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0;flex-wrap:wrap}.btn,.back{border:0;border-radius:11px;padding:10px 15px;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.btn{background:#075c40;color:#fff}.back{background:#fff;border:1px solid #dfe9e5;color:#075c40}.card{background:#fff;border:1px solid #e0ebe6;border-radius:18px;padding:20px;box-shadow:0 7px 20px rgba(7,92,64,.06);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-weight:700;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cfded8;border-radius:10px;font:inherit;background:#fff}.muted{color:#6a7d76;line-height:1.7}.auto{background:#f1f8f5;border:1px solid #d6e9e1;border-radius:12px;padding:13px;line-height:1.8}.notice{padding:12px 15px;border-radius:12px;margin:12px 0;background:#fff8e7;border:1px solid #f1dfad;color:#74580b}.ok{background:#eaf8ef;border-color:#c7e8d1;color:#166534}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photos img{width:100%;height:180px;object-fit:cover;border-radius:12px;border:1px solid #ddd}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #e8efec;text-align:right}th{background:#edf7f2}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f6ef;color:#075c40;font-size:12px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr}table{font-size:12px}}@media print{.no-print,.top,.hero{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}.wrap{width:100%}}</style><link rel="stylesheet" href="../../css/resource-center.css"></head><body><header class="hero"><div class="wrap"><h1>🗂️ أرشيف تفعيل مركز مصادر التعلم</h1><p id="sub">التقارير المحفوظة حسب نطاق صلاحيتك.</p></div></header><main class="wrap"><div class="top"><a class="back" href="index.html">← مركز مصادر التعلم</a><a class="btn" href="new.html">+ توثيق تفعيل</a></div><div class="card no-print"><div class="grid"><div class="field"><label>بحث</label><input id="search" placeholder="المعلمة، الصف، النوع…"></div><div class="field"><label>نوع التفعيل</label><select id="type"><option value="">الكل</option></select></div></div></div><div id="msg"></div><div class="card" style="overflow:auto"><table><thead><tr><th>المعلمة</th><th>النوع</th><th>الصف/الشعبة</th><th>الطلاب</th><th>التاريخ</th><th>التقرير</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="../../js/config.js"></script><script src="../../js/graph.js"></script><script src="../../js/common.js"></script><script src="../../js/resource-center.js"></script><script>let RC,data=[],$=id=>document.getElementById(id);async function load(){try{RC=await WRRC.init();Object.entries(RC.types).forEach(([k,v])=>$('type').insertAdjacentHTML('beforeend',`<option value="${k}">${v.label}</option>`));let q=RC.sb.from('resource_center_activations').select('*').eq('status','completed').order('completed_at',{ascending:false}).limit(500);q=await RC.scopeQuery(q);const r=await q;if(r.error)throw r.error;data=r.data||[];render();}catch(e){$('msg').innerHTML=`<div class="notice">${WRRC.missing(e)?'يلزم تنفيذ ملف إعداد قاعدة البيانات المرفق في Supabase.':WRRC.esc(e.message||e)}</div>`}}function render(){const s=$('search').value.trim(),t=$('type').value;const x=data.filter(r=>(!t||r.activation_type===t)&&(!s||JSON.stringify(r).includes(s)));$('rows').innerHTML=x.length?x.map(r=>`<tr><td>${WRRC.esc(r.teacher_name)}</td><td><span class="pill">${WRRC.esc(r.activation_type_label)}</span></td><td>${WRRC.esc(r.grade)} / ${WRRC.esc(r.section)}</td><td>${r.student_count}</td><td>${WRRC.fmt(r.completed_at)}</td><td><a class="btn" href="report.html?id=${encodeURIComponent(r.id)}">عرض/طباعة</a></td></tr>`).join(''):'<tr><td colspan="6">لا توجد تفعيلات مطابقة.</td></tr>'}$('search').oninput=render;$('type').onchange=render;load();</script></body></html>
