<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توثيق تفعيل مركز مصادر التعلم</title><link rel="stylesheet" href="../../css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#173c34;font-family:Tahoma,Arial,sans-serif}.hero{background:linear-gradient(135deg,#075c40,#16805e);color:#fff;padding:26px}.wrap{width:min(1180px,94%);margin:auto}.hero h1{margin:0 0 7px}.hero p{margin:0;opacity:.92}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0;flex-wrap:wrap}.btn,.back{border:0;border-radius:11px;padding:10px 15px;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.btn{background:#075c40;color:#fff}.back{background:#fff;border:1px solid #dfe9e5;color:#075c40}.card{background:#fff;border:1px solid #e0ebe6;border-radius:18px;padding:20px;box-shadow:0 7px 20px rgba(7,92,64,.06);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-weight:700;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cfded8;border-radius:10px;font:inherit;background:#fff}.muted{color:#6a7d76;line-height:1.7}.auto{background:#f1f8f5;border:1px solid #d6e9e1;border-radius:12px;padding:13px;line-height:1.8}.notice{padding:12px 15px;border-radius:12px;margin:12px 0;background:#fff8e7;border:1px solid #f1dfad;color:#74580b}.ok{background:#eaf8ef;border-color:#c7e8d1;color:#166534}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photos img{width:100%;height:180px;object-fit:cover;border-radius:12px;border:1px solid #ddd}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #e8efec;text-align:right}th{background:#edf7f2}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f6ef;color:#075c40;font-size:12px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr}table{font-size:12px}}@media print{.no-print,.top,.hero{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}.wrap{width:100%}}</style><link rel="stylesheet" href="../../css/resource-center.css"></head><body><header class="hero"><div class="wrap" style="display:flex;align-items:center;gap:16px"><div class="rc-school-mark"><img src="../../assets/school-header.jpg" alt="شعار المدرسة"></div><div><h1>📸 توثيق تفعيل مركز مصادر التعلم</h1><p>بيانات قليلة من المعلمة، والهدف والوصف والتقرير تُنشأ تلقائيًا.</p></div></div></header><main class="wrap"><div class="top"><a class="back" href="index.html">← مركز مصادر التعلم</a><div id="who"></div></div><div id="msg"></div><form id="f" class="card"><div class="grid"><div class="field"><label>اسم المعلمة</label><input id="teacher" readonly></div><div class="field"><label>نوع الحصة / التفعيل</label><select id="type" required><option value="">اختاري…</option><option value="reading">حصة قراءة</option><option value="reserve">حصة احتياط</option><option value="resource">حصة مصادر تعلم</option><option value="subject">تفعيل مادة دراسية</option><option value="special">تربية خاصة / دمج</option><option value="activity">نشاط تعليمي</option></select></div><div class="field"><label>الصف</label><select id="grade" required><option value="">اختاري…</option><option>الأول</option><option>الثاني</option><option>الثالث</option><option>الرابع</option><option>الخامس</option></select></div><div class="field"><label>الشعبة</label><select id="section" required><option value="">اختاري…</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="field"><label>عدد الطلاب الحاضرين</label><input id="count" type="number" min="1" max="60" required></div><div class="field hidden" id="subjectBox"><label>المادة</label><input id="subject" placeholder="اسم المادة"></div></div><h3>الهدف والوصف التلقائي</h3><div class="auto"><b>الهدف:</b> <span id="goal">يظهر بعد اختيار نوع التفعيل.</span><br><b>الوصف:</b> <span id="desc">يظهر بعد اختيار نوع التفعيل.</span></div><div class="field" style="margin-top:16px"><label>شواهد التفعيل (1–3 صور)</label><input id="photos" type="file" accept="image/*" multiple required><div class="muted">يمكن رفع صورة أو صورتين أو ثلاث صور. الحد الأقصى 3.</div></div><div id="preview" class="photos" style="margin-top:12px"></div><div class="actions"><button class="btn" type="submit">💾 حفظ واعتماد التوثيق</button></div></form></main><script src="../../js/config.js"></script><script src="../../js/graph.js"></script><script src="../../js/common.js"></script><script src="../../js/resource-center.js"></script><script>
let RC; const $=id=>document.getElementById(id);
// القوائم الأساسية تعمل حتى في المعاينة المحلية؛ الحساب يُربط عند تشغيل المنصة.
$('teacher').value='سيظهر اسم المعلمة من الحساب';
$('who').textContent='جاري قراءة الحساب…';
(async()=>{
  try{const p=await wrGetCurrentProfile(); if(p){const n=p.full_name||p.email||'المعلمة'; $('teacher').value=n; $('who').textContent=n;}}
  catch(_e){}
  try{RC=await window.WRRC.init(); const u=await RC.user(); const name=RC.profile.full_name||u?.email||$('teacher').value; $('teacher').value=name; $('who').textContent=name;}
  catch(e){$('msg').innerHTML='<div class="notice">معاينة محلية: يمكنكِ تجربة جميع الحقول. الحفظ الفعلي والتقرير والتقييم يرتبطون بالحساب عند فتح الصفحة من المنصة.</div>'}
})();
$('type').onchange=()=>{const t=window.WRRC.types[$('type').value]; $('goal').textContent=t?.goal||'—';$('desc').textContent=t?.desc||'—';$('subjectBox').classList.toggle('hidden',$('type').value!=='subject');$('subject').required=$('type').value==='subject'};
$('photos').onchange=()=>{let fs=[...$('photos').files];if(fs.length>3){alert('الحد الأقصى 3 صور');$('photos').value='';fs=[]}$('preview').innerHTML='';fs.forEach(f=>{const im=new Image();im.src=URL.createObjectURL(f);$('preview').appendChild(im)})};
$('f').onsubmit=async e=>{e.preventDefault();if(!RC){alert('الحفظ والطباعة النهائية يعملان بعد فتح الصفحة من المنصة وتسجيل الدخول.');return}const files=[...$('photos').files];if(!files.length||files.length>3)return alert('ارفعي من صورة إلى 3 صور');const btn=e.submitter;btn.disabled=true;btn.textContent='جاري الحفظ…';try{const u=await RC.user(),p=RC.profile,t=WRRC.types[$('type').value];const row={teacher_user_id:u.id,teacher_name:p.full_name||u.email,department_id:p.department_id||null,department_name:p.department_name||(p.department_names||[]).join('، ')||null,activation_type:$('type').value,activation_type_label:t.label,grade:$('grade').value,section:$('section').value,student_count:+$('count').value,subject:$('subject').value||null,goal:t.goal,description:t.desc,status:'completed',completed_at:new Date().toISOString()};let r=await RC.sb.from('resource_center_activations').insert(row).select().single();if(r.error)throw r.error;const paths=await RC.uploadPhotos(files,r.data.id);let up=await RC.sb.from('resource_center_activations').update({evidence_paths:paths}).eq('id',r.data.id);if(up.error)throw up.error;location.href='report.html?id='+encodeURIComponent(r.data.id)+'&new=1';}catch(err){console.error(err);$('msg').innerHTML=`<div class="notice">${WRRC.missing(err)?'يلزم تنفيذ ملف إعداد قاعدة البيانات المرفق مرة واحدة في Supabase قبل أول استخدام.':'تعذر حفظ التفعيل: '+WRRC.esc(err.message||err)}</div>`;btn.disabled=false;btn.textContent='💾 حفظ واعتماد التوثيق'}};
</script></body></html>
